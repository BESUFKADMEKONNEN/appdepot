<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181c26" />
      <stop offset="100%" stop-color="#0b0e14" />
    </linearGradient>

    <!-- Depot Primary Blue Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Top Cap Light Blue Gradient -->
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Emerald Pulse Accent -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Border Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container Badge -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#262f40" stroke-width="1.8" />

  <!-- Inner Soft Inset Border -->
  <rect x="4" y="4" width="56" height="56" rx="12" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />

  <!-- 3D Geometric Isometric Depot Box / Container -->
  <!-- Top Face -->
  <polygon points="32,15 47,23 32,31 17,23" fill="url(#capGrad)" />

  <!-- Left Face -->
  <polygon points="17,23 32,31 32,47 17,39" fill="url(#primaryGrad)" opacity="0.9" />

  <!-- Right Face -->
  <polygon points="32,31 47,23 47,39 32,47" fill="#1d4ed8" />

  <!-- Center Crease Highlight -->
  <line x1="32" y1="31" x2="32" y2="47" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1.2" stroke-linecap="round" />

  <!-- Top Crease Highlights -->
  <line x1="32" y1="15" x2="32" y2="31" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1" />
  <line x1="17" y1="23" x2="47" y2="23" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" />

  <!-- Linux Depot Terminal / Service Signal Arc -->
  <path d="M 24 12 Q 32 8 40 12" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" opacity="0.8" />
  <path d="M 20 8 Q 32 3 44 8" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" opacity="0.4" />

  <!-- Live Telemetry Status Node (Emerald Dot) -->
  <circle cx="48" cy="48" r="5" fill="url(#emeraldGrad)" filter="url(#glow)" />
  <circle cx="48" cy="48" r="2.2" fill="#ffffff" />
</svg>