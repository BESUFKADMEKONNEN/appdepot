[workspace]
resolver = "2"
members = [
    "crates/appdepot-types",
    "crates/appdepot-core",
    "crates/appdepot-cli",
    "crates/appdepot-helper",
    "crates/appdepot-pty",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Besifkad"]
license = "MIT"
repository = "https://github.com/besifkad/appdepot"
readme = "README.md"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive", "env"] }
directories = "5.0"
sha2 = "0.10"
tempfile = "3.10"
assert_fs = "1.1"

# Internal crates
appdepot-types = { path = "crates/appdepot-types" }
appdepot-core = { path = "crates/appdepot-core" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

