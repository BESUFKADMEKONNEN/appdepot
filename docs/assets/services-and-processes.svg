<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <!-- Window Container -->
  <rect width="1000" height="520" rx="10" fill="#08090d" stroke="#252d3d" stroke-width="1"/>

  <!-- View Header -->
  <g transform="translate(24, 20)">
    <text x="0" y="24" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="18" font-weight="700">Services &amp; Running Processes</text>
    <text x="0" y="44" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11.5">26 live desktop applications · 49 active system daemons (107 total) · Real-time kernel &amp; systemctl telemetry</text>

    <!-- Scope Tabs Bar -->
    <g transform="translate(0, 60)">
      <rect x="0" y="0" width="110" height="28" rx="4" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
      <text x="55" y="18" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">All Active (75)</text>

      <rect x="118" y="0" width="165" height="28" rx="4" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1"/>
      <circle cx="132" cy="14" r="3.5" fill="#10b981"/>
      <text x="142" y="18" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Running Applications (26)</text>

      <rect x="291" y="0" width="150" height="28" rx="4" fill="transparent" stroke="#252d3d" stroke-width="1"/>
      <text x="366" y="18" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">System Daemons (107)</text>

      <rect x="449" y="0" width="155" height="28" rx="4" fill="transparent" stroke="#252d3d" stroke-width="1"/>
      <text x="526" y="18" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">All Host Processes (175)</text>

      <!-- Search Input -->
      <rect x="620" y="0" width="332" height="28" rx="4" fill="#0e1117" stroke="#252d3d" stroke-width="1"/>
      <text x="632" y="18" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11">🔍 vlc</text>
    </g>

    <!-- Section A: Desktop Applications -->
    <g transform="translate(0, 106)">
      <circle cx="6" cy="10" r="3.5" fill="#10b981"/>
      <text x="16" y="14" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.5">LIVE DESKTOP &amp; USER APPLICATIONS (MATCHING "VLC")</text>

      <!-- VLC media player Row -->
      <g transform="translate(0, 26)">
        <rect width="952" height="66" rx="6" fill="#121620" stroke="#252d3d" stroke-width="1"/>
        <line x1="0" y1="0" x2="0" y2="66" stroke="#10b981" stroke-width="4"/>
        
        <rect x="16" y="15" width="36" height="36" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="34" y="38" fill="#f59e0b" font-family="-apple-system, sans-serif" font-size="18" text-anchor="middle">🎬</text>
        
        <text x="64" y="30" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">VLC media player</text>
        <circle cx="195" cy="26" r="3.5" fill="#10b981"/>
        <text x="204" y="30" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">● Running</text>
        
        <rect x="270" y="18" width="85" height="18" rx="3" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
        <text x="278" y="31" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10.5">PID: 160722</text>
        
        <text x="365" y="30" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Media &amp; Audio · /usr/bin/vlc</text>
        
        <text x="64" y="50" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10.5">/usr/bin/vlc --started-from-file /path/to/media.mp4</text>

        <!-- Metrics -->
        <text x="730" y="30" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" text-anchor="end">135 MB</text>
        <text x="730" y="46" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10" text-anchor="end">RSS Memory</text>

        <!-- Actions -->
        <g transform="translate(750, 18)">
          <rect x="0" y="0" width="70" height="28" rx="4" fill="rgba(239, 68, 68, 0.1)" stroke="rgba(239, 68, 68, 0.3)" stroke-width="1"/>
          <text x="12" y="18" fill="#ef4444" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">⏹ Stop</text>

          <rect x="76" y="0" width="55" height="28" rx="4" fill="transparent" stroke="#252d3d" stroke-width="1"/>
          <text x="86" y="18" fill="#f87171" font-family="-apple-system, sans-serif" font-size="11">Kill -9</text>

          <rect x="137" y="0" width="65" height="28" rx="4" fill="transparent" stroke="#252d3d" stroke-width="1"/>
          <text x="147" y="18" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Inspect</text>
        </g>
      </g>
    </g>

    <!-- Section B: Systemd Daemons -->
    <g transform="translate(0, 226)">
      <text x="0" y="14" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.5">SYSTEMD SERVICES (49 ACTIVE / 107 TOTAL)</text>

      <!-- Row 1: Redis Server -->
      <g transform="translate(0, 26)">
        <rect width="952" height="60" rx="6" fill="#121620" stroke="#252d3d" stroke-width="1"/>
        <line x1="0" y1="0" x2="0" y2="60" stroke="#10b981" stroke-width="4"/>
        
        <text x="16" y="27" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="700">Redis Server Daemon</text>
        <circle cx="170" cy="23" r="3.5" fill="#10b981"/>
        <text x="178" y="27" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Active (running)</text>
        <text x="16" y="47" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">redis-server.service · Port :6379 · Advanced key-value store</text>

        <text x="730" y="27" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="700" text-anchor="end">15 MB</text>
        <text x="730" y="43" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10" text-anchor="end">RSS Memory</text>

        <g transform="translate(750, 16)">
          <rect x="0" y="0" width="55" height="26" rx="4" fill="transparent" stroke="#252d3d" stroke-width="1"/>
          <text x="12" y="17" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11">Stop</text>
          <rect x="61" y="0" width="60" height="26" rx="4" fill="transparent" stroke="#252d3d" stroke-width="1"/>
          <text x="70" y="17" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11">Restart</text>
          <rect x="127" y="0" width="75" height="26" rx="4" fill="transparent" stroke="#252d3d" stroke-width="1"/>
          <text x="136" y="17" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11">Journalctl</text>
        </g>
      </g>

      <!-- Row 2: PostgreSQL Database -->
      <g transform="translate(0, 94)">
        <rect width="952" height="60" rx="6" fill="#121620" stroke="#252d3d" stroke-width="1"/>
        <line x1="0" y1="0" x2="0" y2="60" stroke="#10b981" stroke-width="4"/>
        
        <text x="16" y="27" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="700">PostgreSQL RDBMS</text>
        <circle cx="160" cy="23" r="3.5" fill="#10b981"/>
        <text x="168" y="27" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Active (running)</text>
        <text x="16" y="47" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">postgresql@18-main.service · Port :5432 · Object-relational SQL database</text>

        <text x="730" y="27" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="700" text-anchor="end">33 MB</text>
        <text x="730" y="43" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10" text-anchor="end">RSS Memory</text>

        <g transform="translate(750, 16)">
          <rect x="0" y="0" width="55" height="26" rx="4" fill="transparent" stroke="#252d3d" stroke-width="1"/>
          <text x="12" y="17" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11">Stop</text>
          <rect x="61" y="0" width="60" height="26" rx="4" fill="transparent" stroke="#252d3d" stroke-width="1"/>
          <text x="70" y="17" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11">Restart</text>
          <rect x="127" y="0" width="75" height="26" rx="4" fill="transparent" stroke="#252d3d" stroke-width="1"/>
          <text x="136" y="17" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11">Journalctl</text>
        </g>
      </g>
    </g>
  </g>
</svg>
