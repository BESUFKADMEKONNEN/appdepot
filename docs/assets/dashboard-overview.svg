<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141822"/>
      <stop offset="100%" stop-color="#0e1117"/>
    </linearGradient>
  </defs>

  <!-- Desktop App Window Frame -->
  <rect width="1000" height="560" rx="10" fill="#08090d"/>
  <rect width="998" height="558" x="1" y="1" rx="9" fill="none" stroke="#252d3d" stroke-width="1"/>

  <!-- Top Titlebar / Header -->
  <rect x="0" y="0" width="1000" height="50" rx="9" fill="url(#headerGrad)"/>
  <line x1="0" y1="50" x2="1000" y2="50" stroke="#252d3d" stroke-width="1"/>

  <!-- Window controls -->
  <circle cx="20" cy="25" r="5" fill="#ef4444"/>
  <circle cx="36" cy="25" r="5" fill="#f59e0b"/>
  <circle cx="52" cy="25" r="5" fill="#10b981"/>

  <!-- Brand -->
  <rect x="74" y="12" width="26" height="26" rx="5" fill="#1e293b" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
  <text x="87" y="29" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">📦</text>
  <text x="108" y="29" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="700">AppDepot</text>
  <rect x="180" y="17" width="80" height="18" rx="3" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
  <text x="188" y="29" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" font-weight="500">Linux Desktop</text>

  <!-- Top Search Bar -->
  <rect x="340" y="12" width="300" height="26" rx="5" fill="#0b0d13" stroke="#252d3d" stroke-width="1"/>
  <text x="352" y="28" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">🔍 Search apps, VLC, packages, services… (Ctrl+K)</text>

  <!-- Header Right Actions -->
  <rect x="740" y="13" width="75" height="24" rx="12" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
  <circle cx="752" cy="25" r="3.5" fill="#10b981"/>
  <text x="760" y="28" fill="#34d399" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600">Live SSE</text>

  <rect x="825" y="13" width="75" height="24" rx="12" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
  <text x="835" y="28" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600">Health 100%</text>

  <rect x="910" y="12" width="76" height="26" rx="5" fill="#2563eb" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
  <text x="922" y="28" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">+ Install</text>

  <!-- Sidebar -->
  <rect x="0" y="50" width="200" height="510" fill="#0e1117"/>
  <line x1="200" y1="50" x2="200" y2="560" stroke="#252d3d" stroke-width="1"/>

  <text x="16" y="74" fill="#64748b" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.5">NAVIGATION</text>
  
  <!-- Nav items -->
  <rect x="10" y="84" width="180" height="28" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="24" y="102" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600">📁 Library</text>
  <text x="175" y="102" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10.5" text-anchor="end">252</text>

  <text x="24" y="132" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11.5">📦 System Packages</text>
  <text x="175" y="132" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10.5" text-anchor="end">2,720</text>

  <text x="24" y="160" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11.5">⚡ Services &amp; Processes</text>
  <text x="175" y="160" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10.5" text-anchor="end">156</text>

  <text x="24" y="188" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11.5">⚠️ Unorganized</text>
  <text x="175" y="188" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10.5" text-anchor="end">90</text>

  <text x="24" y="216" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11.5">📚 Stacks</text>
  <text x="175" y="216" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10.5" text-anchor="end">6</text>

  <text x="24" y="244" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11.5">🩺 Doctor Diagnostics</text>
  <text x="175" y="244" fill="#10b981" font-family="-apple-system, sans-serif" font-size="10.5" text-anchor="end">✓</text>

  <!-- Categories Section -->
  <text x="16" y="280" fill="#64748b" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.5">CATEGORIES</text>
  <text x="24" y="302" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">🌐 Web Browsers</text>
  <text x="24" y="326" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">💻 IDEs &amp; Editors</text>
  <text x="24" y="350" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">🎵 Media &amp; Audio</text>
  <text x="24" y="374" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">🗄️ Databases</text>
  <text x="24" y="398" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">⚙️ System Tools</text>

  <!-- Main Center Grid Content -->
  <g transform="translate(216, 60)">
    <!-- View Subtitle & Filter Pills -->
    <text x="0" y="20" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">All Applications</text>
    <text x="0" y="38" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">252 applications · 26 live running with real-time memory &amp; PID telemetry · Zero hardcoding</text>

    <!-- Toolbar Pills -->
    <g transform="translate(0, 50)">
      <rect x="0" y="0" width="56" height="24" rx="4" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
      <text x="28" y="16" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">All (252)</text>

      <rect x="62" y="0" width="90" height="24" rx="4" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1"/>
      <circle cx="74" cy="12" r="3" fill="#10b981"/>
      <text x="82" y="16" fill="#34d399" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600">Running (26)</text>

      <rect x="158" y="0" width="75" height="24" rx="4" fill="transparent" stroke="#252d3d" stroke-width="1"/>
      <text x="195" y="16" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10.5" text-anchor="middle">Closed (226)</text>

      <rect x="238" y="0" width="85" height="24" rx="4" fill="transparent" stroke="#252d3d" stroke-width="1"/>
      <text x="280" y="16" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10.5" text-anchor="middle">Managed (18)</text>

      <rect x="328" y="0" width="95" height="24" rx="4" fill="transparent" stroke="#252d3d" stroke-width="1"/>
      <text x="375" y="16" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10.5" text-anchor="middle">Desktop GUI (68)</text>
    </g>

    <!-- App Cards Grid -->
    <!-- Card 1: Antigravity IDE -->
    <g transform="translate(0, 90)">
      <rect width="245" height="135" rx="6" fill="#121620" stroke="#252d3d" stroke-width="1"/>
      <rect x="12" y="12" width="34" height="34" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="29" y="34" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">⚡</text>
      <text x="56" y="26" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Antigravity IDE</text>
      <text x="56" y="42" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10.5">IDEs &amp; Editors · v1.107.0</text>
      
      <!-- Running badge -->
      <rect x="12" y="58" width="130" height="20" rx="3" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
      <circle cx="22" cy="68" r="3" fill="#10b981"/>
      <text x="30" y="72" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">● Running · 796 MB</text>

      <text x="12" y="98" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">PID: 4473 · /opt/Application</text>
      <rect x="12" y="108" width="55" height="18" rx="3" fill="rgba(239, 68, 68, 0.1)" stroke="rgba(239, 68, 68, 0.3)" stroke-width="1"/>
      <text x="22" y="121" fill="#ef4444" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="600">⏹ Stop</text>
    </g>

    <!-- Card 2: VLC media player -->
    <g transform="translate(260, 90)">
      <rect width="245" height="135" rx="6" fill="#121620" stroke="#252d3d" stroke-width="1"/>
      <rect x="12" y="12" width="34" height="34" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="29" y="34" fill="#f59e0b" font-family="-apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">🎬</text>
      <text x="56" y="26" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">VLC media player</text>
      <text x="56" y="42" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10.5">Media &amp; Audio · v3.0.23</text>
      
      <!-- Running badge -->
      <rect x="12" y="58" width="130" height="20" rx="3" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
      <circle cx="22" cy="68" r="3" fill="#10b981"/>
      <text x="30" y="72" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">● Running · 135 MB</text>

      <text x="12" y="98" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">PID: 160722 · /usr/bin/vlc</text>
      <rect x="12" y="108" width="55" height="18" rx="3" fill="rgba(239, 68, 68, 0.1)" stroke="rgba(239, 68, 68, 0.3)" stroke-width="1"/>
      <text x="22" y="121" fill="#ef4444" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="600">⏹ Stop</text>
    </g>

    <!-- Card 3: Google Chrome -->
    <g transform="translate(520, 90)">
      <rect width="245" height="135" rx="6" fill="#121620" stroke="#252d3d" stroke-width="1"/>
      <rect x="12" y="12" width="34" height="34" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="29" y="34" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">🌐</text>
      <text x="56" y="26" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Google Chrome</text>
      <text x="56" y="42" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10.5">Web Browsers · Stable</text>
      
      <!-- Running badge -->
      <rect x="12" y="58" width="130" height="20" rx="3" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
      <circle cx="22" cy="68" r="3" fill="#10b981"/>
      <text x="30" y="72" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">● Running · 535 MB</text>

      <text x="12" y="98" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">PID: 3048 · /opt/google/chrome</text>
      <rect x="12" y="108" width="55" height="18" rx="3" fill="rgba(239, 68, 68, 0.1)" stroke="rgba(239, 68, 68, 0.3)" stroke-width="1"/>
      <text x="22" y="121" fill="#ef4444" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="600">⏹ Stop</text>
    </g>

    <!-- Docked Live Terminal at Bottom -->
    <g transform="translate(0, 240)">
      <rect width="765" height="140" rx="6" fill="#0b0d13" stroke="#252d3d" stroke-width="1"/>
      <rect x="0" y="0" width="765" height="26" rx="6" fill="#121620"/>
      <line x1="0" y1="26" x2="765" y2="26" stroke="#252d3d" stroke-width="1"/>
      <text x="14" y="17" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">🖥️ depot shell — Real POSIX Terminal Stream</text>
      
      <text x="14" y="48" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11">$ depot list --live</text>
      <text x="14" y="68" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10.5">● antigravity  [RUNNING]  PID: 4473    RSS: 796 MB   /opt/Application/ide/antigravity</text>
      <text x="14" y="86" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10.5">● vlc          [RUNNING]  PID: 160722  RSS: 135 MB   /usr/bin/vlc --started-from-file</text>
      <text x="14" y="104" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10.5">● chrome       [RUNNING]  PID: 3048    RSS: 535 MB   /opt/google/chrome/chrome</text>
      <text x="14" y="124" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10.5">Ready for commands: depot doctor, systemctl, journalctl, pkill...</text>
    </g>
  </g>
</svg>
