<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <!-- Window Container -->
  <rect width="1000" height="480" rx="10" fill="#08090d" stroke="#252d3d" stroke-width="1"/>

  <g transform="translate(24, 24)">
    <!-- Hero Banner -->
    <rect width="952" height="74" rx="8" fill="#121622" stroke="#252d3d" stroke-width="1"/>
    <circle cx="44" cy="37" r="18" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1"/>
    <text x="44" y="44" fill="#34d399" font-family="-apple-system, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">🛡️</text>
    <text x="76" y="32" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">System Health Score: 100% — All 8 Core POSIX Audits Passed</text>
    <text x="76" y="52" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11.5">Automated POSIX verification: /opt/Application permissions, devtools group, $PATH symlinks, desktop entries, setuid sandbox.</text>

    <g transform="translate(820, 24)">
      <rect x="0" y="0" width="112" height="28" rx="4" fill="#2563eb" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
      <text x="16" y="18" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">🔄 Rescan Audit</text>
    </g>

    <!-- Audit Checks Rows -->
    <g transform="translate(0, 94)">
      <!-- Check 1 -->
      <g transform="translate(0, 0)">
        <rect width="952" height="52" rx="6" fill="#11151f" stroke="#252d3d" stroke-width="1"/>
        <circle cx="26" cy="26" r="10" fill="rgba(16, 185, 129, 0.15)"/>
        <text x="26" y="30" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">✓</text>
        <text x="50" y="24" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">D-001: Root Directory &amp; Devtools Ownership</text>
        <text x="50" y="40" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">/opt/Application exists with valid 2775 permissions and devtools group assignment</text>
        <rect x="850" y="14" width="86" height="24" rx="4" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
        <text x="893" y="29" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" text-anchor="middle">PASSED</text>
      </g>

      <!-- Check 2 -->
      <g transform="translate(0, 60)">
        <rect width="952" height="52" rx="6" fill="#11151f" stroke="#252d3d" stroke-width="1"/>
        <circle cx="26" cy="26" r="10" fill="rgba(16, 185, 129, 0.15)"/>
        <text x="26" y="30" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">✓</text>
        <text x="50" y="24" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">D-002: System and User $PATH Integration</text>
        <text x="50" y="40" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Binary symlink directory /usr/local/bin and ~/.local/bin present in interactive environment</text>
        <rect x="850" y="14" width="86" height="24" rx="4" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
        <text x="893" y="29" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" text-anchor="middle">PASSED</text>
      </g>

      <!-- Check 3 -->
      <g transform="translate(0, 120)">
        <rect width="952" height="52" rx="6" fill="#11151f" stroke="#252d3d" stroke-width="1"/>
        <circle cx="26" cy="26" r="10" fill="rgba(16, 185, 129, 0.15)"/>
        <text x="26" y="30" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">✓</text>
        <text x="50" y="24" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">D-003: Dangling Symlink and Orphan Sweep</text>
        <text x="50" y="40" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Zero broken symlinks discovered across /opt/Application and /usr/local/bin</text>
        <rect x="850" y="14" width="86" height="24" rx="4" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
        <text x="893" y="29" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" text-anchor="middle">PASSED</text>
      </g>

      <!-- Check 4 -->
      <g transform="translate(0, 180)">
        <rect width="952" height="52" rx="6" fill="#11151f" stroke="#252d3d" stroke-width="1"/>
        <circle cx="26" cy="26" r="10" fill="rgba(16, 185, 129, 0.15)"/>
        <text x="26" y="30" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">✓</text>
        <text x="50" y="24" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">D-006: Chromium &amp; Electron Setuid Sandbox Validation</text>
        <text x="50" y="40" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">chrome-sandbox binaries configured with 4755 root:root permissions for isolated namespaces</text>
        <rect x="850" y="14" width="86" height="24" rx="4" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
        <text x="893" y="29" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" text-anchor="middle">PASSED</text>
      </g>

      <!-- Check 5 -->
      <g transform="translate(0, 240)">
        <rect width="952" height="52" rx="6" fill="#11151f" stroke="#252d3d" stroke-width="1"/>
        <circle cx="26" cy="26" r="10" fill="rgba(16, 185, 129, 0.15)"/>
        <text x="26" y="30" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">✓</text>
        <text x="50" y="24" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">D-007: Polkit Privileged Helper Escalation Endpoint</text>
        <text x="50" y="40" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">appdepot-helper and pkexec policy installed under /usr/share/polkit-1/actions</text>
        <rect x="850" y="14" width="86" height="24" rx="4" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
        <text x="893" y="29" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" text-anchor="middle">PASSED</text>
